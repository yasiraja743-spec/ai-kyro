<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONYX — Profile</title><style>
:root{--bg:#07090d;--panel:#0f131a;--panel2:#141923;--line:#252b38;--text:#f5f7fb;--muted:#8992a3;--accent:#fff;--danger:#ff6675;--ok:#71e0a3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#202633 0,#07090d 46%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:28px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-weight:800;letter-spacing:2px}.back{color:var(--muted);text-decoration:none;font-size:13px}.hero,.card{background:linear-gradient(180deg,rgba(20,25,35,.94),rgba(12,15,21,.96));border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.hero{padding:24px;margin-bottom:14px}.avatar{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#777);color:#080a0d;font-weight:900;font-size:20px;margin-bottom:16px}.name{font-size:24px;font-weight:750}.email{color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.card{padding:20px}.label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:9px}.value{font-size:28px;font-weight:800}.keybox{display:flex;gap:9px}.key{flex:1;min-width:0;background:#090c11;border:1px solid var(--line);border-radius:13px;padding:13px;font:12px ui-monospace,monospace;color:#dce2ec;overflow:auto;white-space:nowrap}.btn{border:1px solid var(--line);background:#f3f5f8;color:#080a0d;border-radius:12px;padding:11px 14px;font-weight:750;cursor:pointer}.btn.secondary{background:var(--panel2);color:var(--text)}.btn.danger{background:transparent;color:var(--danger);border-color:#542b33}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.hint{font-size:12px;color:var(--muted);line-height:1.55;margin-top:12px}.status{margin-top:12px;font-size:13px}.ok{color:var(--ok)}.err{color:var(--danger)}.loading{opacity:.55}@media(max-width:600px){.grid{grid-template-columns:1fr}.keybox{flex-direction:column}.top{margin-bottom:16px}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">ONYX</div><a class="back" href="/">← Kembali ke chat</a></div><section class="hero"><div class="avatar" id="avatar">O</div><div class="name" id="name">Memuat...</div><div class="email" id="email"></div></section><div class="grid"><section class="card"><div class="label">Credit</div><div class="value" id="credits">—</div></section><section class="card"><div class="label">API Key aktif</div><div class="value" id="keyCount">—</div></section></div><section class="card"><div class="label">System API Key</div><div class="keybox"><div class="key" id="key">Belum ada API key aktif</div><button class="btn secondary" id="copy" style="display:none">Salin</button></div><div class="actions"><button class="btn" id="generate">Generate API Key</button><button class="btn danger" id="revoke">Cabut semua key</button></div><div class="hint">API key dibuat dengan random cryptographic token dan di server hanya disimpan sebagai SHA-256 hash. Setelah generate, plaintext key hanya ditampilkan sekali—simpan di tempat aman.</div><div class="status" id="status"></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyD-9NtEYrQMh3jRMu5_b05qbHqwwCS5e9U",authDomain:"login-kyro.firebaseapp.com",projectId:"login-kyro",storageBucket:"login-kyro.firebasestorage.app",messagingSenderId:"139977181475",appId:"1:139977181475:web:574739a079e40207c2e496",measurementId:"G-JFFS13177Y"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth();
let latestKey='';const $=id=>document.getElementById(id);function msg(t,ok=false){$('status').className='status '+(ok?'ok':'err');$('status').textContent=t}async function call(action=''){const u=auth.currentUser;if(!u)throw new Error('Belum login');const token=await u.getIdToken(true);const r=await fetch('/api/profile'+(action?'?action='+action:''),{method:action?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});const d=await r.json();if(!r.ok||!d.status)throw new Error(d.error||'Request gagal');return d}async function load(){try{const d=await call();$('name').textContent=auth.currentUser.displayName||'ONYX User';$('email').textContent=auth.currentUser.email||'';$('avatar').textContent=(auth.currentUser.displayName||auth.currentUser.email||'O').charAt(0).toUpperCase();$('credits').textContent=d.credits??0;$('keyCount').textContent=(d.api_keys||[]).length;const k=(d.api_keys||[])[0];$('key').textContent=k?'onyx_'+k.key_prefix.replace(/^onyx_/,'')+'…':'Belum ada API key aktif';}catch(e){msg(e.message)}}auth.onAuthStateChanged(u=>{if(!u){location.href='/'}else load()});$('generate').onclick=async()=>{try{$('generate').disabled=true;const d=await call('generate');latestKey=d.api_key;$('key').textContent=latestKey;$('copy').style.display='block';$('keyCount').textContent='1';msg('API key berhasil dibuat. Simpan sekarang; key plaintext hanya muncul kali ini.',true)}catch(e){msg(e.message)}finally{$('generate').disabled=false}};$('copy').onclick=async()=>{if(!latestKey)return;await navigator.clipboard.writeText(latestKey);$('copy').textContent='Tersalin';setTimeout(()=>$('copy').textContent='Salin',1300)};$('revoke').onclick=async()=>{if(!confirm('Cabut semua API key aktif?'))return;try{const d=await call('revoke');latestKey='';$('key').textContent='Semua API key sudah dicabut';$('copy').style.display='none';$('keyCount').textContent='0';msg(`${d.revoked||0} API key dicabut.`,true)}catch(e){msg(e.message)}};</script></body></html>
