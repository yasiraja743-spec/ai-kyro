<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONYX Admin</title><style>body{font-family:system-ui;background:#0b0d12;color:#eee;margin:0;padding:24px}main{max-width:1100px;margin:auto}.card{background:#151922;border:1px solid #2a3040;border-radius:14px;padding:16px;margin:12px 0}input,button{padding:11px;border-radius:9px;border:1px solid #333;background:#0e1118;color:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{font-size:24px;font-weight:700}.muted{color:#9aa3b2}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid #292f3b;text-align:left;overflow-wrap:anywhere}.hidden{display:none}.err{color:#ff7070}</style></head><body><main><h1>ONYX Admin</h1><section id="login" class="card"><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="err" class="err"></div></section><section id="dash" class="hidden"><div class="grid" id="stats"></div><div class="card"><button onclick="loadAll()">Refresh</button> <button onclick="logout()">Logout</button></div><div class="card"><h3>Users</h3><div id="users"></div></div><div class="card"><h3>Payments</h3><div id="payments"></div></div></section></main><script>let token=localStorage.onyxAdmin||'';const api=(action,opts={})=>fetch('/api/admin?action='+action,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...(opts.headers||{})},body:opts.body});async function login(){const r=await api('login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!d.status){err.textContent=d.error||'Login gagal';return}token=d.token;localStorage.onyxAdmin=token;show();loadAll()}function show(){loginEl=document.getElementById('login');loginEl.classList.add('hidden');dash.classList.remove('hidden')}async function loadAll(){const [a,b,c]=await Promise.all([api('stats'),api('users'),api('payments')]);const s=await a.json(),us=await b.json(),ps=await c.json();if(!s.status){localStorage.removeItem('onyxAdmin');location.reload();return}stats.innerHTML=Object.entries(s.stats).map(([k,v])=>'<div class="card"><div class="muted">'+k+'</div><div class="stat">'+v+'</div></div>').join('');users.innerHTML=table(us.users||[]);payments.innerHTML=table(ps.payments||[])}function table(rows){if(!rows.length)return'<span class="muted">Kosong</span>';return'<div style="overflow:auto"><table><tr>'+Object.keys(rows[0]).map(k=>'<th>'+k+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+Object.values(r).map(v=>'<td>'+String(v??'')+'</td>').join('')+'</tr>').join('')+'</table></div>'}async function logout(){await api('logout',{method:'POST'});localStorage.removeItem('onyxAdmin');location.reload()}if(token){show();loadAll()}</script></body></html>
